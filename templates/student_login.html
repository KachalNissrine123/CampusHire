{% extends "base.html" %}

{% block title %}Student Login - CampusHire{% endblock %}

{% block content %}
<section style="padding: 80px 0; min-height: calc(100vh - 200px); display: flex; align-items: center;">
    <div class="container">
        <div style="max-width: 480px; margin: 0 auto;">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Student Login</h2>
                    <p class="text-muted" style="margin-top: 8px;">Welcome back! Login to access your dashboard</p>
                </div>
                
                <form method="POST" action="{{ url_for('student_login') }}">
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" placeholder="your.name@aui.ma" required autofocus>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-full">Login</button>
                    
                    <p class="text-center mt-3 text-muted">
                        Don't have an account? <a href="{{ url_for('student_register') }}" style="color: var(--primary); font-weight: 500;">Register here</a>
                    </p>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
