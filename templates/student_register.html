{% extends "base.html" %}

{% block title %}Student Registration - CampusHire{% endblock %}

{% block content %}
<section style="padding: 60px 0; min-height: calc(100vh - 200px);">
    <div class="container">
        <div style="max-width: 600px; margin: 0 auto;">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Create Student Account</h2>
                    <p class="text-muted" style="margin-top: 8px;">Join CampusHire to explore job opportunities at AUI</p>
                </div>
                
                <form method="POST" action="{{ url_for('student_register') }}">
                    <div class="form-group">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="full_name" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" placeholder="your.name@aui.ma" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">School</label>
                            <select name="school" class="form-control" required>
                                <option value="">Select School</option>
                                <option value="SSE">SSE (School of Science & Engineering)</option>
                                <option value="SBA">SBA (School of Business Administration)</option>
                                <option value="SHSS">SHSS (School of Humanities & Social Sciences)</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Student Type</label>
                            <select name="student_type" class="form-control" required>
                                <option value="">Select Type</option>
                                <option value="Undergraduate">Undergraduate</option>
                                <option value="Graduate">Graduate</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Level</label>
                            <select name="level" class="form-control" required>
                                <option value="">Select Level</option>
                                <option value="Freshman">Freshman</option>
                                <option value="Sophomore">Sophomore</option>
                                <option value="Junior">Junior</option>
                                <option value="Senior">Senior</option>
                                <option value="Graduate">Graduate</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">GPA (Optional)</label>
                            <input type="number" name="gpa" class="form-control" step="0.01" min="0" max="4" placeholder="3.50">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Completed Credits (Optional)</label>
                        <input type="number" name="credits" class="form-control" min="0" placeholder="60">
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-full">Create Account</button>
                    
                    <p class="text-center mt-3 text-muted">
                        Already have an account? <a href="{{ url_for('student_login') }}" style="color: var(--primary); font-weight: 500;">Login here</a>
                    </p>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
